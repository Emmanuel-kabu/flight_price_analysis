flight_project_1:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'host.docker.internal') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'analytics_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'analytics_password') }}"
      dbname: "{{ env_var('POSTGRES_DATABASE', 'flight_price_analysis_analytics_db') }}"
      schema: analytics
      threads: 4
